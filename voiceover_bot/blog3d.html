<script type="module">

// stop lines (none on a plain street)

// roundabout: asphalt disc over the block corners + island

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;

const pastel = ["#e9cfa2", "#efe1c0", "#f0d7b3", "#e3c9a3", "#f2e6cf", "#e6d2b0"];

const leaf = new THREE.MeshLambertMaterial({color: "#8ccf5e", flatShading: true}), trunk = mat("#7a5a3c");

if (!SC.street) for (let s = 20; s < 130; s += 9) for (const sg of [-1, 1]) {
  if (armOpen(sg < 0 ? "N" : "S")) { tree(8.4, sg * s, 0.9 + (s % 3) * 0.1); tree(-8.4, sg * s, 0.95); }

// ================================================================== plain street (questions about stopping, crosswalks, parking)
function noiseTex(base, spots, rep0, rep1) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) { const v = Math.floor(rnd() * 30 - 15); g.fillStyle = `rgba(${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${v > 0 ? 255 : 0},${Math.abs(v) / 120})`; g.fillRect(rnd() * 256, rnd() * 256, 2, 2); }
  for (let i = 0; i < spots; i++) { g.fillStyle = "rgba(40,40,44,.05)"; g.beginPath(); g.ellipse(rnd() * 256, rnd() * 256, 10 + rnd() * 30, 4 + rnd() * 12, rnd() * 3, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep0, rep1); t.anisotropy = 4; return t;

  g.fillStyle = "#b9bcc0"; g.fillRect(0, 0, 128, 128);

  g.strokeStyle = "#9da1a6"; g.lineWidth = 2; g.strokeRect(0, 0, 128, 128); g.beginPath(); g.moveTo(64, 0); g.lineTo(64, 128); g.moveTo(0, 64); g.lineTo(128, 64); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 200); t.anisotropy = 4; return t;

function yellowFacadeTex(rows, cols) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 256; const g = c.getContext("2d");
  g.fillStyle = "#ddc27a"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(120,90,40,${rnd() * 0.05})`; g.fillRect(rnd() * 256, rnd() * 256, 3, 3); }
  g.fillStyle = "#f2e9cf"; g.fillRect(0, 0, 256, 18); g.fillRect(0, 118, 256, 8); g.fillRect(0, 244, 256, 12);        // cornice and floor bands

const leafA = new THREE.MeshLambertMaterial({color: "#5da545"}), leafB = new THREE.MeshLambertMaterial({color: "#7bc45a"}), leafC = new THREE.MeshLambertMaterial({color: "#4a9137"});
function lushTree(x, z, sc = 1) {

  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * sc, 0.3 * sc, 3.4 * sc, 8), mat("#6e5035")); tr.position.y = 1.7 * sc; tr.castShadow = true; g.add(tr);

  for (const [dx, dy, dz, r, m] of blobs) { const l = new THREE.Mesh(new THREE.IcosahedronGeometry(r * sc, 2), m); l.position.set(dx * sc, dy * sc, dz * sc); l.scale.set(1, 0.88, 1); l.castShadow = true; g.add(l); }

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 8.2, 8), m); pole.position.y = 4.1; pole.castShadow = true; g.add(pole);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.6, 6), m); arm.rotation.z = Math.PI / 2; arm.position.set(dir * 1.3, 8.1, 0); g.add(arm);

function buildStreet() {

    g.fillStyle = "#fff"; g.font = "900 64px Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("STOP", 128, 132);

  ov.fillStyle = "#fff"; ov.font = `900 64px ${FONT}`; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText(String(left), x, y + 3);
}

// ================================================================== ticket card
const C = TL.card, cimg = new Image(); cimg.src = C.img;
const CW = 660, CH = CW * C.ar;
function drawCard(x, y, s, alpha, t, label) {
  if (alpha <= 0 || s <= 0) return;
  ov.save(); ov.globalAlpha = alpha; ov.translate(x, y); ov.scale(s, s);
  ov.shadowColor = "rgba(0,0,0,.45)"; ov.shadowBlur = 40; ov.shadowOffsetY = 16; rrect(0, 0, CW, CH, 26); ov.fillStyle = "#fff"; ov.fill();
  ov.shadowColor = "transparent"; ov.save(); rrect(0, 0, CW, CH, 26); ov.clip(); ov.drawImage(cimg, 0, 0, CW, CH);
  C.boxes.forEach(([a, b], i) => {         // options appear one by one
    const k = clamp((t - (TL.reveal[i] ?? 0)) / 0.25);
    if (k < 1) { ov.globalAlpha = alpha * (1 - k); ov.fillStyle = "#fff"; ov.fillRect(0, a * CH - 6, CW, (b - a) * CH + 12); ov.globalAlpha = alpha; }
  });
  ov.restore();
  if (C.correct && C.boxes[C.correct - 1] && t >= TL.green) {
    const [a, b] = C.boxes[C.correct - 1], k = clamp((t - TL.green) / 0.3);
    ov.globalAlpha = alpha * k; rrect(14, a * CH - 2, CW - 28, (b - a) * CH + 4, 16); ov.fillStyle = "rgba(46,204,113,.22)"; ov.fill(); ov.lineWidth = 6; ov.strokeStyle = "#2ECC71"; ov.stroke();
    const cy = (a + b) / 2 * CH; ov.translate(CW - 52, cy); ov.scale(popK(t, TL.green), popK(t, TL.green));
    ov.beginPath(); ov.arc(0, 0, 22, 0, 7); ov.fillStyle = "#2ECC71"; ov.fill(); ov.strokeStyle = "#fff"; ov.lineWidth = 5; ov.lineCap = "round";
    ov.beginPath(); ov.moveTo(-9, 1); ov.lineTo(-2, 8); ov.lineTo(10, -7); ov.stroke();
  }
  ov.restore();
  if (label) { ov.save(); ov.globalAlpha = alpha; ov.font = `900 15px ${FONT}`; const w = ov.measureText(label).width + 18; rrect(x + 10, y + 10, w, 26, 7); ov.fillStyle = "rgba(14,16,20,.88)"; ov.fill(); ov.fillStyle = "#fff"; ov.textAlign = "left"; ov.textBaseline = "middle"; ov.fillText(label, x + 19, y + 24); ov.restore(); }
}
const pimg = new Image(); if (TL.promo) pimg.src = TL.promo;
function promoPhase(t, b) {          // channel advert: profile screenshot + arrow at the link
  const k = ez((t - b.t0) / 0.5), out = 1 - clamp((t - b.t1 + 0.35) / 0.35), al = Math.min(k, out);
  if (al <= 0 || !pimg.naturalWidth) return;
  ov.fillStyle = `rgba(8,10,14,${0.62 * al})`; ov.fillRect(0, 0, W, H);
  const w = 640, h = w * pimg.naturalHeight / pimg.naturalWidth, x = (W - w) / 2, y = Math.max(300, (H - h) / 2 - 40);
  const s = (0.7 + 0.3 * k) * (1 + 0.015 * Math.sin((t - b.t0) * 3));
  ov.save(); ov.globalAlpha = al; ov.translate(W / 2, y + h / 2); ov.scale(s, s); ov.translate(-W / 2, -(y + h / 2));
  ov.shadowColor = "rgba(0,0,0,.5)"; ov.shadowBlur = 40; rrect(x, y, w, h, 24); ov.fillStyle = "#fff"; ov.fill(); ov.shadowBlur = 0;
  ov.save(); rrect(x, y, w, h, 24); ov.clip(); ov.drawImage(pimg, x, y, w, h); ov.restore();
  ov.lineWidth = 6; ov.strokeStyle = LIME; rrect(x, y, w, h, 24); ov.stroke(); ov.restore();
  // red pencil underline under the link line + red arrow pointing at it
  const [mx0, mx1, my] = TL.promoMark || [0.1, 0.7, 0.85];
  const ux0 = W / 2 + (x + w * mx0 - W / 2) * s, ux1 = W / 2 + (x + w * mx1 - W / 2) * s, uy = y + h / 2 + (y + h * my - (y + h / 2)) * s + 7;
  const kd = clamp((t - b.t0 - 0.7) / 0.6);
  if (kd > 0) {           // straight red marker line, drawn left to right
    ov.save(); ov.globalAlpha = al; ov.strokeStyle = "#E53935"; ov.lineWidth = 8; ov.lineCap = "round";
    ov.beginPath(); ov.moveTo(ux0 - 6, uy); ov.lineTo(lerp(ux0 - 6, ux1 + 8, kd), uy); ov.stroke(); ov.restore();
  }
  const ka = clamp((t - b.t0 - 1.1) / 0.3);
  if (ka > 0) {           // arrow from above, at an angle, tip on the end of the link
    const bob = 10 * Math.sin((t - b.t0) * 7), tipX = ux1 - 4, tipY = uy - 30, ang = -0.6;   // tilted to the right
    ov.save(); ov.globalAlpha = al * ka; ov.translate(tipX + 0.5 * bob, tipY - bob); ov.rotate(ang);
    ov.fillStyle = "#E53935"; ov.strokeStyle = "#fff"; ov.lineWidth = 4; ov.beginPath();
    ov.moveTo(0, 0); ov.lineTo(-34, -48); ov.lineTo(-12, -48); ov.lineTo(-12, -120); ov.lineTo(12, -120); ov.lineTo(12, -48); ov.lineTo(34, -48); ov.closePath(); ov.fill(); ov.stroke(); ov.restore();
  }
  ov.globalAlpha = al; capBox(TL.promoCap || "ВСЕ *800 ВОПРОСОВ* - В _TG-БОТЕ_", W / 2, Math.min(H - 150, y + h + 190), popK(t, b.t0 + 0.4)); ov.globalAlpha = 1;
}
function cardPhase(t) {
  const X = (W - CW) / 2, Y = 180, A0 = TL.answer[0];
  if (t >= A0) {
    const k = ez((t - A0) / 0.6); ov.fillStyle = `rgba(8,10,14,${0.55 * k})`; ov.fillRect(0, 0, W, H);
    drawCard(X + CW * 0.08 * (1 - k), (H - CH) / 2 + 40 * (1 - k), 0.84 + 0.16 * k, k, t); return;
  }
  if (t < TL.cardIn) return;
  const ti = ez((t - TL.cardIn) / 0.55);
  if (t < TL.cardOut) { drawCard(X, lerp(-CH - 40, Y, ti), 1, Math.min(1, ti * 2), t); return; }
  const mEnd = BEATS.length ? BEATS[0].t1 : TL.cardOut + 2, ko = ez((t - TL.cardOut) / 0.8), s = lerp(1, 0.34, ko);
  const fade = 1 - clamp((t - mEnd) / 0.4);
  drawCard(lerp(X, 24, ko), lerp(Y, 330, ko), s, fade, TL.answer[0] - 1, ko > 0.9 ? "В БИЛЕТЕ" : "");
}

// ================================================================== frame
let firstMain = BEATS.find(b => b.main), firstMainT = firstMain ? firstMain.t0 : 1e9;
window.renderAt = (t) => {
  for (const a of Object.values(ACT)) placeActor(a, t);
  for (const pd of Object.values(PEDS)) placePeds(pd, t);
  const bon = Math.floor(t * 1.6) % 2 === 0; for (const [m, c] of BLINK) { if (c) m.material.color.set(bon ? c : new THREE.Color(c).multiplyScalar(0.18)); else m.visible = bon; }
  camAt(t);
  const A0 = TL.answer[0];
  // arrows: from the first beat that shows them until the answer; fade once the actor is gone
  for (const [id, ar] of Object.entries(ARROWS)) {
    const b = BEATS.find(b => b.arrows.includes(id)); if (!b || t < b.t0) { ar.rib.grow(0, 0); ar.head.visible = false; continue; }
    const k = ez((t - b.t0 - 0.2) / 1.2), go = GO[id];
    let al = t > A0 ? 1 - clamp((t - A0) / 0.5) : 1; if (go !== undefined) al = Math.min(al, 1 - clamp((t - go - 1.5) / 1.0));
    ar.rib.grow(k, al); placeHead(ar, k, al);
  }
  // main road bands
  const bk = ez((t - firstMainT - 0.1) / 1.3), bal = t > A0 ? 1 - clamp((t - A0) / 0.5) : 1;
  BANDS.forEach((b, i) => b.grow(i === 0 ? bk : ez((t - firstMainT - 0.6) / 1.0), bal));
  // plate laid on the road
  if (BIGPLATE) {
    const pb = BEATS.find(b => b.plate);
    if (pb && t >= pb.t0) {
      const k = ez((t - pb.t0 - 0.1) / 1.4), endT = firstMainT < 1e9 && firstMainT >= pb.t0 ? firstMainT + 0.9 : pb.t1 + 1.2;
      BIGPLATE.visible = t < endT + 0.6; BIGPLATE.position.set(0, lerp(36, 0.12, k), lerp(16, 0, k));
      const s = lerp(0.22, 1, k); BIGPLATE.scale.set(s, s, s); BIGPLATE.material.opacity = Math.min(k * 3, 1) * 0.82 * (1 - clamp((t - endT) / 0.6));
    } else BIGPLATE.visible = false;
  }
  // zones + rulers of the current beat
  for (const z of Object.values(ZONES)) z.visible = false;
  for (const r of Object.values(RULERS)) r.visible = false;
  const cb = BEATS.find(b => b.t0 <= t && t < b.t1), RLAB = [];
  if (cb && t < A0) {
    const kk = ez((t - cb.t0 - 0.2) / 0.4), oo = 1 - clamp((t - cb.t1 + 0.3) / 0.3);
    for (const [nm, kind] of (cb.zones || [])) {
      const a = findActor(nm); if (!a) continue;
      const z = zoneFor(a, kind); z.visible = kk * oo > 0.01; z.position.set(a.obj.position.x, 0.08, a.obj.position.z); z.rotation.y = a.obj.rotation.y;
      const sc = 0.75 + 0.25 * kk; z.scale.set(sc, 1, sc); z.children[0].material.opacity = 0.38 * kk * oo; z.children[1].material.opacity = 0.95 * kk * oo;
    }
    for (const [nm, txt, len] of (cb.rulers || [])) {
      const a = findActor(nm); if (!a) continue;
      const r = rulerFor(a, len); r.visible = kk * oo > 0.01; r.userData.mat.opacity = kk * oo; RLAB.push([r.userData.mid, txt || ("< " + len + " М"), kk * oo]);
    }
  }
  renderer.render(scene, camera);
  ov.clearRect(0, 0, W, H);
  for (const [mid, txt, al] of RLAB) { const [x, y, ok] = proj(mid); if (ok) capBox("_" + txt.toUpperCase() + "_", x + 70, y, popK(t, cb.t0 + 0.5), al, 30); }
  if (t >= TL.cardOut + 0.3 && t < A0 && !(cb && cb.promo)) for (const a of Object.values(ACT)) if (a.letter) {
    const [x, y, ok] = proj(a.obj.position.clone().setY(a.obj.userData.h + 0.9));
    if (ok) letterBadge(x, y, a.letter, popK(t, TL.cardOut + 0.5) * (1 - clamp((t - A0 + 0.3) / 0.3)));
  }
  // beat overlays
  let cur = null; for (const b of BEATS) if (b.t0 <= t && t < b.t1) cur = b;
  if (cur && t < A0) {
    const out = 1 - clamp((t - cur.t1 + 0.25) / 0.25);
    for (const tg of cur.tags) { const p = target(tg.target, t); const [x, y, ok] = proj(p); if (ok) tag(x, y, tg.sub, tg.title, popK(t, tg.t) * out, tg.color); }
    for (const [id, kind] of cur.checks) { const p = actorTop(id); if (!p) continue; const [x, y] = proj(p.add(V(0, 1.4, 0))); badge(x, y, kind, popK(t, cur.t0 + 0.6) * out); }
    if (cur.cross) { const p = crossPoint(cur.cross[0], cur.cross[1]); if (p) { const [x, y] = proj(p); const s = popK(t, cur.t0 + 1.2) * (1 + 0.08 * Math.sin(t * 8)); badge(x, y, "!", s * out); } }
  }
  topicBadge();
  if (cur && cur.promo) promoPhase(t, cur);
  if (cur && cur.cap && t < A0) capBox(cur.cap, W / 2, 250, popK(t, cur.t0 + 0.05), 1 - clamp((t - cur.t1 + 0.25) / 0.25));
  // hook stickers
  if (TL.hookText && t < TL.cardIn + 0.4) {
    const fade = 1 - clamp((t - TL.cardIn) / 0.4);
    ov.globalAlpha = fade;
    sticker(TL.hookText, W / 2, 330, "#E53935", "#fff", popK(t, 0.2), -0.04);
    sticker("ВОПРОС ПДД", W / 2, 470, LIME, "#111", popK(t, 0.8), 0.03);
    ov.globalAlpha = 1;
  }
  cardPhase(t);
  timer(t);
  return true;
};
const fontsReady = () => Promise.all([document.fonts.load(`900 50px M`, "АБВabc"), document.fonts.load(`900 50px Montserrat`, "АБВabc"), document.fonts.load(`800 16px Montserrat`, "АБВabc")]).catch(() => 0);
cimg.decode().catch(() => 0).then(() => TL.promo ? pimg.decode().catch(() => 0) : 0).then(fontsReady).then(() => { window.renderAt(0); window.__ready = true; });
</script></body></html>
