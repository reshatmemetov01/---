  if (t < TL.cardOut + 0.5 || !BEATS.length) return shot("сверху", 0);

function camAt(t) {

}

// ================================================================== overlay helpers
const ov = document.getElementById("ov").getContext("2d");

// "*green*" and "_red_" markup -> words with colors
function words(text) {

    if (tok === "*") { col = col === LIME ? "#fff" : LIME; continue; }
    if (tok === "_") { col = col === RED ? "#fff" : RED; continue; }

  }

}
function layout(ws, font, maxW) {
  ov.font = font; const sp = ov.measureText(" ").width, lines = [[]]; let lw = 0;
  for (const w of ws) { const ww = ov.measureText(w[0]).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([w[0], w[1], ww]); lw += ww + sp; }

}

}

  const w = L.width + 48, h = L.lines.length * lh + 26;
  ov.save(); ov.globalAlpha = alpha; ov.translate(cx, cy); ov.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, 16); ov.fillStyle = "rgba(14,16,20,.9)"; ov.fill(); ov.lineWidth = 2; ov.strokeStyle = "rgba(185,246,74,.45)"; ov.stroke();
  ov.font = font; ov.textAlign = "left"; ov.textBaseline = "middle"; drawLines(L, 0, 2, lh); ov.restore();
}

  const font = `900 46px ${FONT}`, L = layout(words(text).map(w => [w[0], fg]), font, 560), lh = 52;
  const w = L.width + 40, h = L.lines.length * lh + 18;
  ov.save(); ov.translate(cx, cy); ov.rotate(rotA); ov.scale(s, s);

  ov.font = font; ov.textAlign = "left"; ov.textBaseline = "middle"; drawLines(L, 0, 3, lh); ov.restore();
}
function tag(x, y, sub, title, s) {

  ov.font = `800 14px ${FONT}`; const sw = sub ? ov.measureText(sub.toUpperCase()).width : 0;
  const w = Math.max(L.width, sw) + 30, h = L.lines.length * 30 + (sub ? 36 : 20), bx = clamp(x, w / 2 + 12, W - w / 2 - 12), by = Math.max(y - 58 - h / 2, 300 + h / 2);
  ov.save(); ov.globalAlpha = Math.min(1, s);
  ov.strokeStyle = LIME; ov.lineWidth = 3; ov.beginPath(); ov.moveTo(bx, by + h / 2); ov.lineTo(x, y); ov.stroke();
  ov.beginPath(); ov.arc(x, y, 6, 0, 7); ov.fillStyle = LIME; ov.fill(); ov.lineWidth = 2; ov.strokeStyle = "#111"; ov.stroke();
  ov.translate(bx, by); ov.scale(s, s);
  rrect(-w / 2, -h / 2, w, h, 12); ov.fillStyle = "rgba(14,16,20,.92)"; ov.fill(); ov.lineWidth = 2; ov.strokeStyle = "rgba(255,255,255,.18)"; ov.stroke();
  ov.textAlign = "left"; ov.textBaseline = "middle";
  if (sub) { ov.font = `800 14px ${FONT}`; ov.fillStyle = "#b9bec6"; ov.textAlign = "center"; ov.fillText(sub.toUpperCase(), 0, -h / 2 + 18); ov.textAlign = "left"; }
  ov.font = font; drawLines(L, 0, (sub ? 9 : 1), 30); ov.restore();

function badge(x, y, kind, s) {

  ov.beginPath(); ov.arc(0, 0, 30, 0, 7); ov.fillStyle = kind === "ok" ? "#2ECC71" : kind === "x" ? "#E53935" : "#E53935"; ov.fill(); ov.lineWidth = 5; ov.strokeStyle = "#fff"; ov.stroke();
  ov.strokeStyle = "#fff"; ov.lineWidth = 7; ov.lineCap = "round"; ov.beginPath();
  if (kind === "ok") { ov.moveTo(-12, 1); ov.lineTo(-3, 10); ov.lineTo(13, -9); ov.stroke(); }
  else if (kind === "x") { ov.moveTo(-10, -10); ov.lineTo(10, 10); ov.moveTo(10, -10); ov.lineTo(-10, 10); ov.stroke(); }
  else { ov.fillStyle = "#fff"; ov.font = `900 38px ${FONT}`; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText("!", 0, 2); }
  ov.restore();
}
function topicBadge() {
  if (!TL.topic) return;
  ov.font = `900 17px ${FONT}`; const txt = "ПДД · " + TL.topic.toUpperCase(), w = ov.measureText(txt).width + 26;
  rrect(24, 128, w, 32, 9); ov.fillStyle = "rgba(14,16,20,.85)"; ov.fill(); ov.lineWidth = 1.5; ov.strokeStyle = "rgba(185,246,74,.6)"; ov.stroke();
  ov.fillStyle = "#fff"; ov.textAlign = "left"; ov.textBaseline = "middle"; ov.fillText("ПДД · ", 37, 145); ov.fillStyle = LIME; ov.fillText(TL.topic.toUpperCase(), 37 + ov.measureText("ПДД · ").width, 145);
}
function timer(t) {
  const [t0, n] = TL.timer; if (t < t0 || t > t0 + n) return;
  const left = Math.max(1, Math.ceil(t0 + n - t)), k = (t - t0) / n, x = W / 2, y = 1010;
  ov.beginPath(); ov.arc(x, y, 66, 0, Math.PI * 2); ov.fillStyle = "rgba(10,12,14,.85)"; ov.fill();
  ov.beginPath(); ov.arc(x, y, 60, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); ov.lineWidth = 10; ov.strokeStyle = LIME; ov.lineCap = "round"; ov.stroke();
  ov.fillStyle = "#fff"; ov.font = `900 64px ${FONT}`; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText(String(left), x, y + 3);
}

// ================================================================== ticket card
const C = TL.card, cimg = new Image(); cimg.src = C.img;
const CW = 660, CH = CW * C.ar;
function drawCard(x, y, s, alpha, t, label) {
  if (alpha <= 0 || s <= 0) return;
  ov.save(); ov.globalAlpha = alpha; ov.translate(x, y); ov.scale(s, s);
  ov.shadowColor = "rgba(0,0,0,.45)"; ov.shadowBlur = 40; ov.shadowOffsetY = 16; rrect(0, 0, CW, CH, 26); ov.fillStyle = "#fff"; ov.fill();
  ov.shadowColor = "transparent"; ov.save(); rrect(0, 0, CW, CH, 26); ov.clip(); ov.drawImage(cimg, 0, 0, CW, CH);
  C.boxes.forEach(([a, b], i) => {         // options appear one by one
    const k = clamp((t - (TL.reveal[i] ?? 0)) / 0.25);
    if (k < 1) { ov.globalAlpha = alpha * (1 - k); ov.fillStyle = "#fff"; ov.fillRect(0, a * CH - 6, CW, (b - a) * CH + 12); ov.globalAlpha = alpha; }
  });

    const [a, b] = C.boxes[C.correct - 1], k = clamp((t - TL.green) / 0.3);
    ov.globalAlpha = alpha * k; rrect(14, a * CH - 2, CW - 28, (b - a) * CH + 4, 16); ov.fillStyle = "rgba(46,204,113,.22)"; ov.fill(); ov.lineWidth = 6; ov.strokeStyle = "#2ECC71"; ov.stroke();
    const cy = (a + b) / 2 * CH; ov.translate(CW - 52, cy); ov.scale(popK(t, TL.green), popK(t, TL.green));
    ov.beginPath(); ov.arc(0, 0, 22, 0, 7); ov.fillStyle = "#2ECC71"; ov.fill(); ov.strokeStyle = "#fff"; ov.lineWidth = 5; ov.lineCap = "round";
    ov.beginPath(); ov.moveTo(-9, 1); ov.lineTo(-2, 8); ov.lineTo(10, -7); ov.stroke();
  }
  ov.restore();
  if (label) { ov.save(); ov.globalAlpha = alpha; ov.font = `900 15px ${FONT}`; const w = ov.measureText(label).width + 18; rrect(x + 10, y + 10, w, 26, 7); ov.fillStyle = "rgba(14,16,20,.88)"; ov.fill(); ov.fillStyle = "#fff"; ov.textAlign = "left"; ov.textBaseline = "middle"; ov.fillText(label, x + 19, y + 24); ov.restore(); }
}
function cardPhase(t) {
  const X = (W - CW) / 2, Y = 180, A0 = TL.answer[0];
  if (t >= A0) {
    const k = ez((t - A0) / 0.6); ov.fillStyle = `rgba(8,10,14,${0.55 * k})`; ov.fillRect(0, 0, W, H);
    drawCard(X + CW * 0.08 * (1 - k), (H - CH) / 2 + 40 * (1 - k), 0.84 + 0.16 * k, k, t); return;
  }

  if (t < TL.cardOut) { drawCard(X, lerp(-CH - 40, Y, ti), 1, Math.min(1, ti * 2), t); return; }

  const fade = 1 - clamp((t - mEnd) / 0.4);
  drawCard(lerp(X, 24, ko), lerp(Y, 330, ko), s, fade, TL.answer[0] - 1, ko > 0.9 ? "В БИЛЕТЕ" : "");
}

// ================================================================== frame
let firstMain = BEATS.find(b => b.main), firstMainT = firstMain ? firstMain.t0 : 1e9;
window.renderAt = (t) => {
  for (const a of Object.values(ACT)) placeActor(a, t);
  for (const pd of Object.values(PEDS)) placePeds(pd, t);
  const bon = Math.floor(t * 1.6) % 2 === 0; for (const [m, c] of BLINK) { if (c) m.material.color.set(bon ? c : new THREE.Color(c).multiplyScalar(0.18)); else m.visible = bon; }
  camAt(t);
  const A0 = TL.answer[0];
  // arrows: from the first beat that shows them until the answer; fade once the actor is gone
  for (const [id, ar] of Object.entries(ARROWS)) {
    const b = BEATS.find(b => b.arrows.includes(id)); if (!b || t < b.t0) { ar.rib.grow(0, 0); ar.head.visible = false; continue; }
    const k = ez((t - b.t0 - 0.2) / 1.2), go = GO[id];
    let al = t > A0 ? 1 - clamp((t - A0) / 0.5) : 1; if (go !== undefined) al = Math.min(al, 1 - clamp((t - go - 1.5) / 1.0));

  }
  // main road bands
  const bk = ez((t - firstMainT - 0.1) / 1.3), bal = t > A0 ? 1 - clamp((t - A0) / 0.5) : 1;
  BANDS.forEach((b, i) => b.grow(i === 0 ? bk : ez((t - firstMainT - 0.6) / 1.0), bal));

    if (pb && t >= pb.t0) {
      const k = ez((t - pb.t0 - 0.1) / 1.4), endT = firstMainT < 1e9 && firstMainT >= pb.t0 ? firstMainT + 0.9 : pb.t1 + 1.2;
      BIGPLATE.visible = t < endT + 0.6; BIGPLATE.position.set(0, lerp(36, 0.12, k), lerp(16, 0, k));
      const s = lerp(0.22, 1, k); BIGPLATE.scale.set(s, s, s); BIGPLATE.material.opacity = Math.min(k * 3, 1) * 0.82 * (1 - clamp((t - endT) / 0.6));
    } else BIGPLATE.visible = false;
  }

  ov.clearRect(0, 0, W, H);
  // beat overlays
  let cur = null; for (const b of BEATS) if (b.t0 <= t && t < b.t1) cur = b;
  if (cur && t < A0) {
    const out = 1 - clamp((t - cur.t1 + 0.25) / 0.25);
    for (const tg of cur.tags) { const p = target(tg.target, t); const [x, y, ok] = proj(p); if (ok) tag(x, y, tg.sub, tg.title, popK(t, tg.t) * out); }
    for (const [id, kind] of cur.checks) { const p = actorTop(id); if (!p) continue; const [x, y] = proj(p.add(V(0, 1.4, 0))); badge(x, y, kind, popK(t, cur.t0 + 0.6) * out); }
    if (cur.cross) { const p = crossPoint(cur.cross[0], cur.cross[1]); if (p) { const [x, y] = proj(p); const s = popK(t, cur.t0 + 1.2) * (1 + 0.08 * Math.sin(t * 8)); badge(x, y, "!", s * out); } }
  }

const fontsReady = () => Promise.all([document.fonts.load(`900 50px M`, "АБВabc"), document.fonts.load(`900 50px Montserrat`, "АБВabc"), document.fonts.load(`800 16px Montserrat`, "АБВabc")]).catch(() => 0);
cimg.decode().catch(() => 0).then(fontsReady).then(() => { window.renderAt(0); window.__ready = true; });
</script></body></html>
