const leaf = new THREE.MeshLambertMaterial({color: "#5c9a45", flatShading: true}), trunk = mat("#7a5a3c");

for (let s = 19; s < 120; s += 9) for (const sg of [-1, 1]) { tree(7.8, sg * s, 0.9 + (s % 3) * 0.1); tree(-7.8, sg * s, 0.95); tree(sg * s, 7.8, 0.9); tree(sg * s, -7.8, 1.0); }

// ================================================================== approach frames

// ================================================================== vehicles

// left/right/straight paths in the local S frame, from the stop position

const ACT = {};

// path arrow for our car
const limeMat = new THREE.MeshBasicMaterial({color: LIME, transparent: true, opacity: 0.95});

// ================================================================== camera
const ov = document.getElementById("ov").getContext("2d");
const OVER = [[8, 16, 34], [-1, 0, -2]], TOP = [[0.01, 52, 14], [0, 0, 0]];

function camAt(t) {
  const keys = [[0, OVER, OVER]];
  for (const [ft, i] of TL.focus) keys.push([ft, null, i]);
  keys.push([TL.resolve - 0.4, TOP, null]);
  keys.sort((a, b) => a[0] - b[0]);
  let cur = 0; for (let i = 0; i < keys.length; i++) if (keys[i][0] <= t) cur = i;
  const sh = (k) => k[1] || shotFor(FOC[k[2]]);
  const to = sh(keys[cur]), from = cur > 0 ? sh(keys[cur - 1]) : to, kk = ez((t - keys[cur][0]) / 1.1);
  const p = from[0].map((v, i) => lerp(v, to[0][i], kk)), q = from[1].map((v, i) => lerp(v, to[1][i], kk));
  camera.position.set(...p); camera.lookAt(...q);
}

// ================================================================== overlay helpers
function proj(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; }
function rrect(x, y, w, h, r) { ov.beginPath(); ov.moveTo(x + r, y); ov.arcTo(x + w, y, x + w, y + h, r); ov.arcTo(x + w, y + h, x, y + h, r); ov.arcTo(x, y + h, x, y, r); ov.arcTo(x, y, x + w, y, r); ov.closePath(); }
function popK(t, t0, d = 0.22) { const k = Math.min(1, Math.max(0, (t - t0) / d)); return k <= 0 ? 0 : 1 + 0.25 * Math.sin(k * Math.PI) * (1 - k); }
function caption(words, t, t0) {
  const s = 1 + 0.12 * Math.max(0, 1 - (t - t0) / 0.14);
  ov.save(); ov.translate(W / 2, 175); ov.scale(s, s); ov.font = "900 50px " + FONT; ov.textAlign = "left"; ov.textBaseline = "middle";
  const lines = [[]]; let lw = 0;
  for (const w of words) { const ww = ov.measureText(w[0] + " ").width; if (lw + ww > 640 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(w); lw += ww; }
  lines.forEach((ln, li) => {
    const full = ov.measureText(ln.map(w => w[0]).join(" ")).width; let x = -full / 2; const y = (li - (lines.length - 1) / 2) * 58;
    for (const [w, hl] of ln) { ov.lineWidth = 10; ov.strokeStyle = "rgba(0,0,0,.55)"; ov.lineJoin = "round"; ov.strokeText(w, x, y); ov.fillStyle = hl ? LIME : "#fff"; ov.fillText(w, x, y); x += ov.measureText(w + " ").width; }
  });
  ov.restore();
}
function bubble(x, y, txt, s) {
  if (s <= 0) return; ov.save(); ov.translate(x, y); ov.scale(s, s);
  ov.beginPath(); ov.arc(0, 0, 27, 0, Math.PI * 2); ov.fillStyle = LIME; ov.fill(); ov.lineWidth = 4; ov.strokeStyle = "#111"; ov.stroke();
  ov.fillStyle = "#111"; ov.font = "900 30px " + FONT; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText(txt, 0, 2); ov.restore();
}
function plate(x, y, title, sub, s) {
  if (s <= 0) return; ov.save(); ov.translate(x, y); ov.scale(s, s);
  ov.font = "900 26px " + FONT; const w1 = ov.measureText(title).width; ov.font = "800 16px " + FONT; const w2 = ov.measureText((sub || "").toUpperCase()).width;
  const w = Math.max(w1, w2) + 34, h = sub ? 66 : 44;
  rrect(-w / 2, -h / 2, w, h, 12); ov.fillStyle = "rgba(14,16,20,.9)"; ov.fill();
  ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillStyle = "#fff"; ov.font = "900 26px " + FONT; ov.fillText(title, 0, sub ? -10 : 1);
  if (sub) { ov.fillStyle = LIME; ov.font = "800 16px " + FONT; ov.fillText(sub.toUpperCase(), 0, 17); }
  ov.restore();
}
function timer(t) {
  const [t0, n] = TL.timer; if (t < t0 || t > t0 + n) return;
  const left = Math.max(1, Math.ceil(t0 + n - t)), k = (t - t0) / n, x = W / 2, y = 535;
  ov.beginPath(); ov.arc(x, y, 66, 0, Math.PI * 2); ov.fillStyle = "rgba(10,12,14,.82)"; ov.fill();
  ov.beginPath(); ov.arc(x, y, 60, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); ov.lineWidth = 10; ov.strokeStyle = LIME; ov.lineCap = "round"; ov.stroke();
  ov.fillStyle = "#fff"; ov.font = "900 64px " + FONT; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText(String(left), x, y + 3);
}

// ================================================================== card phase
const C = TL.card, CX = 40, CY = 330, CW2 = 640;
const cimg = document.getElementById("card"), cbg = document.getElementById("cbg");
cimg.src = C.img; cbg.style.backgroundImage = `url(${C.img})`;
const cpx = (fx, fy) => [CX + fx * CW2, CY + fy * CW2 * (cimg.naturalHeight / cimg.naturalWidth || 1)];
function cardPhase(t) {
  const E0 = TL.expl[0], A0 = TL.answer[0];
  let vis = 1, sc = 1, ox = 0, oy = 0, rot3 = "";
  if (t < 0.9) { const k = ez(t / 0.9); vis = Math.min(1, t / 0.2); rot3 = `perspective(1400px) rotateY(${-38 * (1 - k)}deg) rotateX(${18 * (1 - k)}deg) translateY(${120 * (1 - k)}px)`; sc = 0.6 + 0.4 * k; }
  else if (t >= E0 - 0.1 && t < A0) { const k = ez((t - E0 + 0.1) / 0.7); sc = 1 + 1.4 * k; vis = 1 - k; const [px, py] = cpx(0.5, (C.photoY || 0.3)); ox = (360 - px) * k; oy = (640 - py) * k; }
  else if (t >= A0) { const k = ez((t - A0) / 0.6); sc = 1.25 - 0.25 * k; vis = k; }
  cimg.style.opacity = vis; cbg.style.opacity = vis; cimg.style.transform = `translate(${ox}px,${oy}px) ${rot3} scale(${sc})`;
  if (!(t < E0 - 0.1 || t >= A0)) return;
  if (t < TL.question[0] + 0.6) {
    C.objects.slice(0, 3).forEach((o, i) => { const [x, y] = cpx(o.x, Math.max(0.13, o.y - (o.ry || 0.05) - 0.04)); bubble(x, y, "?", popK(t, 0.9 + i * 0.3)); });
    if (TL.stamp && t > TL.hook[1] - 0.9) {
      const k = Math.min(1, (t - TL.hook[1] + 0.9) / 0.3), s2 = 3.2 - 2.2 * k;
      ov.save(); ov.translate(360, CY + 470); ov.rotate(-0.21); ov.scale(s2, s2); ov.globalAlpha = Math.min(1, k * 1.5);
      ov.font = "900 70px " + FONT; const w = ov.measureText(TL.stamp).width + 50;
      rrect(-w / 2, -50, w, 100, 14); ov.fillStyle = "rgba(255,255,255,.9)"; ov.fill(); ov.lineWidth = 8; ov.strokeStyle = "#E53935"; ov.stroke();
      ov.fillStyle = "#E53935"; ov.textAlign = "center"; ov.textBaseline = "middle"; ov.fillText(TL.stamp, 0, 4); ov.restore();
    }
  }
  if (t >= TL.question[0] && t < E0 - 0.1) {
    const k = Math.min(1, (t - TL.question[0]) / Math.max(0.8, TL.question[1] - TL.question[0] - 0.3));
    const tot = C.underline.reduce((a, u) => a + u[1] - u[0], 0); let acc = 0;
    ov.strokeStyle = "#E53935"; ov.lineWidth = 4; ov.lineCap = "round";
    for (const u of C.underline) { const part = Math.max(0, Math.min(1, (k * tot - acc) / (u[1] - u[0]))); acc += u[1] - u[0];
      if (part > 0) { const [x1, y] = cpx(u[0], u[2]), [x2] = cpx(u[0] + (u[1] - u[0]) * part, u[2]); ov.beginPath(); ov.moveTo(x1, y); ov.lineTo(x2, y); ov.stroke(); } }
  }
  if (C.green && t >= TL.answer[1] - 0.1) {
    const g = C.green, [x, y] = cpx(g[0], g[1]), [x2, y2] = cpx(g[0] + g[2], g[1] + g[3]), k = Math.min(1, (t - TL.answer[1] + 0.1) / 0.35);
    ov.globalAlpha = k; rrect(x, y, x2 - x, y2 - y, 14); ov.fillStyle = "rgba(46,204,113,.22)"; ov.fill(); ov.lineWidth = 5; ov.strokeStyle = "#2ECC71"; ov.stroke(); ov.globalAlpha = 1;
    plate(360, 1080, TL.ansTitle, C.ans, 1.45 * popK(t, TL.answer[1]));
  }
}

// ================================================================== frame
window.renderAt = (t) => {
  for (const a of Object.values(ACT)) a.objs ? placePeds(a, t) : placeActor(a, t);
  camAt(t);
  const showPath = t > TL.expl[0] && t < TL.resolve + 2.5;
  const nDash = showPath ? Math.min(pathDashes.length, Math.floor((t - TL.expl[0]) * 12)) : 0;
  pathDashes.forEach((d, i) => d.visible = i < nDash);
  limeMat.opacity = showPath ? (t > TL.resolve + 1 ? Math.max(0, 1 - (t - TL.resolve - 1) / 1.5) : 0.95) : 0;
  let curF = null; for (const [ft, i] of TL.focus) if (ft <= t && t < TL.resolve - 0.4) curF = [ft, i];
  FOC.forEach(f => f.ringObj.visible = false);
  for (const [ft, i] of TL.focus) if (ft <= t && t < TL.resolve - 0.4) {
    const f = FOC[i], r = f.ringObj, p = focusPoint(f); r.position.set(p.x, 0.3, p.z); r.visible = true;
    const s = 1 + 0.12 * Math.sin((t - ft) * 6) * Math.exp(-(t - ft)); r.scale.set(s, s, s); r.material.opacity = curF && curF[1] === i ? 1 : 0.55;
  }
  renderer.render(scene, camera);
  ov.clearRect(0, 0, W, H);
  cardPhase(t);
  let cap = null; for (const c of TL.caps) if (c[0] <= t) cap = c;
  if (cap && !(TL.capOff.some(o => o <= t && o > cap[0]))) caption(cap[1], t, cap[0]);
  timer(t);
  if (curF) { const f = FOC[curF[1]], p = focusPoint(f).add(new THREE.Vector3(0, f.labelH || 3.6, 0)); const [x, y] = proj(p);
    plate(Math.min(W - 150, Math.max(150, x)), Math.max(330, y - 30), f.label, f.sub, popK(t, curF[0] + 0.5)); }
  return true;
};
const fontsReady = () => Promise.all([document.fonts.load("900 50px M", "\u0410\u0411\u0412abc"), document.fonts.load("900 50px Montserrat", "\u0410\u0411\u0412abc"), document.fonts.load("800 16px Montserrat", "\u0410\u0411\u0412abc")]).catch(() => 0);
cimg.decode().catch(() => 0).then(fontsReady).then(() => { window.renderAt(0); window.__ready = true; });
</script></body></html>
